<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06070b">
<title>RH AI DJ Lab</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg"></div>
<header class="top">
  <div class="brand"><span class="mark">RH</span><span>AI DJ <b>LAB</b></span></div>
  <div class="top-actions"><span class="engine-pill" id="enginePill">ENGINE IDLE</span></div>
</header>

<main class="main">
  <section class="hero">
    <div>
      <p class="kicker">AUTONOMOUS MIXING</p>
      <h1>Твоя музыка.<br><em>Твой DJ.</em></h1>
      <p class="hero-sub">Добавь треки в библиотеку, включи первый — и нажми Mix. Дальше движок сам анализирует, выбирает и сводит.</p>
    </div>
    <div class="hero-visual"><div class="orbit"></div><div class="core">MIX</div><div class="ring r1"></div><div class="ring r2"></div></div>
  </section>

  <div class="search-wrap">
    <input id="searchInput" type="search" placeholder="Трек, исполнитель, альбом…" autocomplete="off">
    <button id="searchBtn">Найти</button>
  </div>
  <div class="search-meta" id="searchMeta"></div>
  <section id="searchResults" class="grid"></section>

  <div class="section-head"><h2>Моя музыка</h2><span id="libraryCount">0 треков</span></div>
  <section id="library" class="library"></section>
</main>

<footer class="player" id="player">
  <div class="cover" id="cover"><span>♪</span></div>
  <div class="track-info"><div class="track-title" id="trackTitle">Ничего не играет</div><div class="track-artist" id="trackArtist">Добавь трек и нажми Play</div><div class="deck-info" id="deckInfo"></div></div>
  <div class="player-mid">
    <div class="timeline">
      <input id="seekBar" type="range" min="0" max="1000" value="0" aria-label="Позиция трека">
      <span class="mix-marker" id="mixMarker" hidden><i></i><b>MIX</b></span>
    </div>
    <div class="times"><span id="currentTime">0:00</span><span id="mixPointLabel"></span><span id="durationTime">0:00</span></div>
    <div class="controls">
      <button id="playBtn" class="round">▶</button>
      <button id="nextBtn" class="ghost">⏭</button>
      <button id="mixBtn" class="mix">MIX</button>
    </div>
  </div>
  <div class="mix-state" id="mixState">Mix выключен</div>
</footer>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
